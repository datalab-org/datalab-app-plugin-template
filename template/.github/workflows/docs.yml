---
name: Documentation
on:
  pull_request:

  release:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
    build-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                version: "${{ env.UV_VERSION }}"
                enable-cache: true

            - name: Install dependencies
              run: |
                uv sync --locked --all-extras --dev

            - name: Build docs
              run: |
                uv run mkdocs build --strict

            # Only deploy if GitHub Pages is enabled for this repository
            # (Settings -> Pages -> Source: "GitHub Actions"); otherwise, skip deployment
            - name: Check GitHub Pages is enabled
              id: pages
              if: github.event_name == 'push'
              uses: actions/configure-pages@v5
              continue-on-error: true

            - name: Report skipped deployment
              if: github.event_name == 'push' && steps.pages.outcome != 'success'
              run: echo "::notice::GitHub Pages is not enabled for this repository; skipping docs deployment."

            - name: Upload doc artifact
              uses: actions/upload-pages-artifact@v3
              if: github.event_name == 'push' && steps.pages.outcome == 'success'
              with:
                  path: ./site

            - name: Deploy to GitHub Pages
              if: github.event_name == 'push' && steps.pages.outcome == 'success'
              uses: actions/deploy-pages@v4
              id: deployment
